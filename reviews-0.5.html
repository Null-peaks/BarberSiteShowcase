<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    query,
    orderBy,
    limit,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCRhMUJzbYt4KSURZAvLn9vHWEJlI3HtgA",
    authDomain: "barbershopsitetest.firebaseapp.com",
    projectId: "barbershopsitetest",
    storageBucket: "barbershopsitetest.firebasestorage.app",
    messagingSenderId: "676678702556",
    appId: "1:676678702556:web:5f50699c3737e2feb0ab19",
    measurementId: "G-MP8L9Z93RM"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const grid = document.getElementById("reviewsGrid");
  const status = document.getElementById("reviewsStatus");

  const avgNumEl = document.getElementById("avgRatingNumber");
  const avgStarsEl = document.getElementById("avgRatingStars");
  const avgCountEl = document.getElementById("avgRatingCount");

  function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

  // Create one star SVG where fillPercent can be 0..100
  function starSvg(fillPercent){
    const id = "g" + Math.random().toString(16).slice(2);
    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox","0 0 24 24");
    svg.setAttribute("aria-hidden","true");

    // Star shape path
    const d = "M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z";

    // Defs gradient for partial fill
    const defs = document.createElementNS("http://www.w3.org/2000/svg","defs");
    const grad = document.createElementNS("http://www.w3.org/2000/svg","linearGradient");
    grad.setAttribute("id", id);
    grad.setAttribute("x1","0"); grad.setAttribute("x2","1");
    grad.setAttribute("y1","0"); grad.setAttribute("y2","0");

    const stop1 = document.createElementNS("http://www.w3.org/2000/svg","stop");
    stop1.setAttribute("offset", `${clamp(fillPercent,0,100)}%`);
    stop1.setAttribute("stop-color", "rgba(199,155,42,0.95)"); // gold

    const stop2 = document.createElementNS("http://www.w3.org/2000/svg","stop");
    stop2.setAttribute("offset", `${clamp(fillPercent,0,100)}%`);
    stop2.setAttribute("stop-color", "rgba(0,0,0,0.15)"); // empty side

    grad.appendChild(stop1);
    grad.appendChild(stop2);
    defs.appendChild(grad);
    svg.appendChild(defs);

    // Star filled by gradient
    const star = document.createElementNS("http://www.w3.org/2000/svg","path");
    star.setAttribute("d", d);
    star.setAttribute("fill", `url(#${id})`);
    svg.appendChild(star);

    return svg;
  }

  function renderAverage(avg, count){
    if(!avgNumEl || !avgStarsEl || !avgCountEl) return;

    if(!count){
      avgNumEl.textContent = "—";
      avgStarsEl.innerHTML = "";
      avgCountEl.textContent = "No reviews yet";
      return;
    }

    const rounded = Math.round(avg * 10) / 10;     // 1 decimal
    avgNumEl.textContent = rounded.toFixed(1);
    avgCountEl.textContent = `${count} review${count === 1 ? "" : "s"}`;

    avgStarsEl.innerHTML = "";
    for(let i=1;i<=5;i++){
      const amount = clamp(avg - (i - 1), 0, 1);   // 0..1 for this star
      avgStarsEl.appendChild(starSvg(amount * 100));
    }
  }

  function starsText(n){
    const r = clamp(Number(n) || 5, 1, 5);
    let s = "";
    for(let i=1;i<=5;i++) s += (i <= r ? "★" : "☆");
    return { r, s };
  }

  function makeCard({ name, rating, message }){
    const article = document.createElement("article");
    article.className = "card pad";

    const top = document.createElement("div");
    top.className = "topline";

    const title = document.createElement("strong");
    const safeMsg = (message || "").trim();
    title.textContent = safeMsg
      ? `“${safeMsg.slice(0, 52)}${safeMsg.length > 52 ? "…" : ""}”`
      : "“Great cut.”";

    const chip = document.createElement("span");
    chip.className = "chip gold";
    chip.textContent = "Verified";

    top.appendChild(title);
    top.appendChild(chip);

    const { r, s } = starsText(rating);

    const stars = document.createElement("div");
    stars.className = "stars";
    stars.setAttribute("aria-label", `${r} stars`);
    stars.textContent = s;

    const quote = document.createElement("p");
    quote.className = "quote";
    quote.textContent = safeMsg || "—";

    const who = document.createElement("div");
    who.className = "who";

    const left = document.createElement("span");
    left.textContent = `— ${name || "Anonymous"}`;

    const right = document.createElement("span");
    right.textContent = "Customer";

    who.appendChild(left);
    who.appendChild(right);

    article.appendChild(top);
    article.appendChild(stars);
    article.appendChild(quote);
    article.appendChild(who);

    return article;
  }

  // NOTE: requires createdAt (Timestamp) on docs.
  const q = query(collection(db, "reviews"), orderBy("createdAt", "desc"), limit(30));

  onSnapshot(q, (snap) => {
    grid.innerHTML = "";

    if(status) status.textContent = snap.empty ? "No reviews yet" : `${snap.size} live`;

    if(snap.empty){
      renderAverage(0, 0);

      const empty = document.createElement("article");
      empty.className = "card pad";
      empty.style.gridColumn = "span 12";
      empty.innerHTML = `
        <div class="topline">
          <strong>No reviews yet</strong>
          <span class="chip blue">Be first</span>
        </div>
        <p class="quote">Tap “Write a Review” to leave the first one.</p>
      `;
      grid.appendChild(empty);
      return;
    }

    // Compute average from snapshot
    let sum = 0;
    let count = 0;

    snap.forEach(docSnap => {
      const d = docSnap.data() || {};
      const rating = clamp(Number(d.rating) || 0, 1, 5);
      sum += rating;
      count += 1;
    });

    const avg = sum / count;
    renderAverage(avg, count);

    // Render cards
    snap.forEach(docSnap => {
      const d = docSnap.data() || {};
      const name = typeof d.name === "string" ? d.name : "Anonymous";
      const message = typeof d.message === "string" ? d.message : "";
      const rating = clamp(Number(d.rating) || 5, 1, 5);
      grid.appendChild(makeCard({ name, rating, message }));
    });

  }, (err) => {
    console.error(err);

    if(status) status.textContent = "Error loading";
    renderAverage(0, 0);

    grid.innerHTML = "";
    const bad = document.createElement("article");
    bad.className = "card pad";
    bad.style.gridColumn = "span 12";
    bad.innerHTML = `
      <div class="topline">
        <strong>Couldn’t load reviews</strong>
        <span class="chip red">Check Firestore</span>
      </div>
      <p class="quote">
        Most common causes: (1) Firestore rules block reads, or (2) your reviews docs are missing <b>createdAt</b>.
      </p>
    `;
    grid.appendChild(bad);
  });
</script>
